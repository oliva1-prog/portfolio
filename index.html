<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ольга Иващенко (Иволга) — Портфолио</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         oklch(16% 0.008 260);
      --surface:    oklch(21% 0.010 260);
      --border:     oklch(28% 0.012 260);
      --text-muted: oklch(52% 0.012 260);
      --text:       oklch(88% 0.006 260);
      --accent:     oklch(58% 0.20 264);
      --accent-hi:  oklch(68% 0.18 264);
      --accent-dim: oklch(42% 0.14 264);
      --r-sm: 3px;
      --r-md: 8px;
      --r-lg: 12px;
      --font: 'Source Code Pro', 'Courier New', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font);
      color: var(--text);
      user-select: none;
    }

    /* ── Удалён принудительный поворот экрана на мобайле (удалено) ── */
    /* Прежний блок принудительной landscape ориентации был удалён:
       он выглядел как:
       @media screen and (max-width: 768px) and (orientation: portrait) { ... }
       Теперь мобильная версия будет адаптироваться без принудной rotate-логики. */

    #stage {
      position: relative;
      width: 100%; height: 100%;
    }

    #title {
      position: fixed;
      top: clamp(18px, 4vh, 40px);
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      z-index: 90;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #title.show { animation: titleFade 2.4s ease forwards; }
    #title h1 {
      font-family: var(--font);
      font-size: clamp(0.85rem, 1.6vw, 1.15rem);
      font-weight: 400;
      letter-spacing: 0.18em;
      color: var(--text);
      text-transform: uppercase;
    }
    #title p {
      font-family: var(--font);
      font-size: clamp(0.65rem, 1vw, 0.78rem);
      color: var(--text-muted);
      letter-spacing: 0.22em;
      font-style: italic;
    }
    @keyframes titleFade {
      from { opacity: 0; transform: translateX(-50%) translateY(8px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    #invite-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      padding: 6px 14px 6px 10px;
      border-radius: 20px;
      text-decoration: none;
      font-family: var(--font);
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: var(--accent);
      color: oklch(97% 0.006 264);
      border: 1px solid var(--accent-hi);
      box-shadow: 0 2px 12px oklch(58% 0.20 264 / 0.35);
      transition: background 0.18s, box-shadow 0.18s, transform 0.18s;
      pointer-events: none;
      opacity: 0;
    }
    #title.show #invite-btn {
      opacity: 1;
      pointer-events: all;
    }
    #invite-btn:hover {
      background: var(--accent-hi);
      box-shadow: 0 4px 20px oklch(68% 0.18 264 / 0.45);
      transform: translateY(-1px);
    }
    #invite-btn:active { transform: translateY(0); }
    #invite-btn svg { flex-shrink: 0; }

    #hint {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font);
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity 0.8s;
      pointer-events: none;
      z-index: 90;
    }
    #hint.show { opacity: 1; }

    .journal-wrap {
      position: absolute;
      opacity: 0;
      cursor: grab;
      touch-action: none;
    }
    .journal-wrap:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: var(--r-md);
    }
    .journal-wrap.dragging {
      cursor: grabbing;
      transition: none !important;
    }

    .journal-cover {
      width: 100%;
      aspect-ratio: 3/4;
      border-radius: var(--r-md);
      overflow: hidden;
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow:
        0 12px 40px oklch(5% 0.01 260 / 0.65),
        0 3px  8px  oklch(5% 0.01 260 / 0.35);
      transition: box-shadow 0.2s ease, transform 0.15s ease;
      pointer-events: none;
    }
    .journal-wrap:not(.dragging):not(.fly):hover .journal-cover {
      box-shadow:
        0 20px 60px oklch(5% 0.01 260 / 0.75),
        0 6px  16px oklch(5% 0.01 260 / 0.45);
      transform: scale(1.025);
    }
    .journal-cover img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .cover-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 10px 12px 14px;
      background: transparent;
      font-family: var(--font);
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-hi);
      line-height: 1.4;
    }
    .journal-num {
      position: absolute;
      top: 8px; left: 10px;
      font-family: var(--font);
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      color: var(--accent-hi);
      font-weight: 500;
    }

    @keyframes flyUp {
      0%   { transform: translateY(110vh) rotate(0deg);            opacity: 0; }
      55%  { opacity: 1; }
      72%  { transform: translateY(-18px) rotate(calc(var(--rot)*0.6)); }
      84%  { transform: translateY(8px)   rotate(calc(var(--rot)*1.15)); }
      93%  { transform: translateY(-4px)  rotate(calc(var(--rot)*0.92)); }
      100% { transform: translateY(0)     rotate(var(--rot));       opacity: 1; }
    }
    .journal-wrap.fly {
      animation: flyUp 1.05s cubic-bezier(0.18, 0.58, 0.36, 1) forwards;
    }
    .journal-wrap.landed {
      opacity: 1;
      transform: rotate(var(--rot));
    }

    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: oklch(6% 0.01 260 / 0.78);
      backdrop-filter: blur(4px);
      z-index: 100;
      cursor: pointer;
    }
    #overlay.show { display: block; }

    #spread-container {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      pointer-events: none;
      align-items: center;
      justify-content: center;
    }
    #spread-container.show { display: flex; }

    #spread {
      pointer-events: all;
      position: relative;
      width: min(94vw, 980px);
      height: min(82vh, 660px);
      display: flex;
      background: oklch(97% 0.004 264);
      border-radius: var(--r-lg);
      overflow: hidden;
      box-shadow: 0 28px 90px oklch(4% 0.02 260 / 0.85);
      transform: scale(0.86) translateY(16px);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.34, 1.24, 0.64, 1), opacity 0.3s ease;
    }
    #spread.open { transform: scale(1) translateY(0); opacity: 1; }
    #spread::after {
      content: '';
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(to right, oklch(55% 0.04 264 / 0.22), oklch(75% 0.02 264 / 0.06), oklch(55% 0.04 264 / 0.22));
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 3;
    }

    .page { width: 50%; height: 100%; overflow: hidden; position: relative; }
    .page-photo { background: oklch(20% 0.01 260); }
    .page-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 8px 12px 10px;
      background: transparent;
      font-family: var(--font);
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      color: oklch(78% 0.008 264);
      font-style: italic;
      line-height: 1.4;
    }

    .page-text {
      background: oklch(97.5% 0.003 264);
      padding: clamp(28px,5%,52px) clamp(24px,5%,48px) 60px;
      display: flex; flex-direction: column;
      justify-content: flex-start;
      overflow-y: auto;
      color: oklch(20% 0.01 264);
    }

    #pagination {
      position: absolute; bottom: 16px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 5; pointer-events: all;
    }
    .page-dot {
      width: 24px; height: 24px; border-radius: 50%;
      border: 1px solid oklch(55% 0.08 264);
      background: transparent; cursor: pointer;
      transition: background 0.16s, border-color 0.16s;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font); font-size: 0.58rem;
      color: oklch(55% 0.08 264);
    }
    .page-dot:hover, .page-dot.active {
      background: var(--accent);
      border-color: var(--accent);
      color: oklch(97% 0.005 264);
    }
    .page-dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .arrow-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: oklch(97% 0.004 264 / 0.55);
      border: 1px solid oklch(82% 0.015 264);
      border-radius: 50%; width: 34px; height: 34px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      z-index: 5; transition: background 0.14s; pointer-events: all;
      color: oklch(28% 0.01 264);
    }
    .arrow-btn:hover { background: oklch(100% 0 0 / 0.9); }
    .arrow-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #btn-prev { left: -46px; }
    #btn-next { right: -46px; }
    @media (max-width: 680px) {
      #btn-prev { left: 4px; }
      #btn-next { right: 4px; }
    }

    /* ── MOBILE TAP ZONES (inside open spread) ── */
    .tap-zone {
      display: none;
      position: absolute;
      top: 0; bottom: 0;
      width: 40%;
      z-index: 10;
      cursor: pointer;
    }
    .tap-zone-left  { left: 0; }
    .tap-zone-right { right: 0; }
    @media (max-width: 768px) {
      .tap-zone { display: block; }
    }

    /* ── МЕТОДЫ ДЛЯ МОБАЙЛ ── */
    /* Контейнер мобильной ленты (карточки журналов) */
    #mobile-strip {
      display: none;
      position: fixed;
      top: 100px; /* отступ от верха — можно настроить */
      left: 0; right: 0;
      padding: 8px 12px;
      display: flex; gap: 12px; overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 85;
      scrollbar-width: thin;
    }

    .mobile-strip .mobile-card {
      flex: 0 0 auto;
      width: min(88vw, 420px);
      border-radius: var(--r-md);
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: 0 12px 40px oklch(5% 0.01 260 / 0.50);
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }
    .mobile-strip .mobile-card img {
      width: 100%; height: auto; display: block;
    }
    .mobile-strip .mobile-caption {
      padding: 10px 12px;
      font-family: var(--font);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-hi);
    }

    /* Правый кликабельный участок для перехода к следующему журналу */
    .mobile-strip .mobile-right {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 50%;
      cursor: pointer;
    }

    /* Фокус/навигация доступна через клавиатуру */
    .mobile-strip .mobile-card:focus { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Мобильный режим: стили Stage скрыты, чтобы не мешать */
    @media (max-width: 768px) {
      #stage { display: none; } /* скрываем стажер на мобайле */
      #mobile-strip { display: flex; } /* показываем мобильную ленту */
    }

  </style>
</head>
<body>

<div id="title">
  <h1>Ольга Иващенко (Иволга)</h1>
  <p>Пермь</p>
  <a id="invite-btn" href="https://t.me/cofe_tochno" target="_blank" rel="noopener noreferrer" aria-label="Invite to project">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    пригласить в проект
  </a>
</div>

<div id="stage"></div>
<div id="hint">нажмите на журнал, чтобы открыть</div>

<div id="overlay" tabindex="0" role="button" aria-label="Close journal"></div>

<div id="spread-container" role="dialog" aria-modal="true" aria-label="Journal">
  <button class="arrow-btn" id="btn-prev" aria-label="Previous spread">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
      <path d="M8.5 2L3.5 6.5L8.5 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <div id="spread" tabindex="-1">
    <div class="tap-zone tap-zone-left"  id="tap-left"></div>
    <div class="tap-zone tap-zone-right" id="tap-right"></div>
  </div>
  <button class="arrow-btn" id="btn-next" aria-label="Next spread">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
      <path d="M4.5 2L9.5 6.5L4.5 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <div id="pagination"></div>
</div>

<!-- Мобильная лента журналов (мобильная версия) -->
<div id="mobile-strip" aria-label="Журналы — мобильная версия" class="mobile-strip" style="display:none"></div>

<script>
const JOURNALS = [
  {
    title: "Journal I",
    cover: { img: "https://raw.githubusercontent.com/oliva1-prog/portfolio/main/Обложка_айдентика.png", label: "Айдентика" },
    spreads: [
      { type:"normal", photo:"images/j1/s1.jpg", photoCaption:"detail study, 2021", heading:"About", text:"All starts with details. Small decisions pile up into habit, and habit becomes destiny.\n\nI searched long for my own voice. Tried tools, environments, formats. And kept returning to what works honestly, without decoration for decoration's sake." },
      { type:"normal", photo:"images/j1/s2.jpg", photoCaption:"studio commission, first visualization", heading:"First Project", text:"A small commission. Visualizing space for a studio. But here I understood: real design is not about beauty.\n\nIt is about precision. When form answers content, that is beauty." },
      { type:"fullbleed", photo:"https://raw.githubusercontent.com/oliva1-prog/portfolio/main/Разворот_айдентика.png", caption:"Perm region, 2022 – searching for texture" },
      { type:"normal", photo:"images/j1/s4.jpg", photoCaption:"paper and concrete — material samples", heading:"Material and Light", text:"I work with the material. Paper texture, film grain, concrete roughness – all of it is information, not decoration.\n\nLight reads surfaces. My task is to put them in right relation." },
      { type:"normal", photo:"images/j1/s5.jpg", photoCaption:"year-end sketchbook, selected pages", heading:"Result", text:"A year: eight projects, three failures, two discoveries. Failures taught more.\n\nMost important: stop fearing empty space. Emptiness is not a mistake, it is a choice." }
    ]
  },
  {
    title: "Journal II",
    cover: { img: "https://raw.githubusercontent.com/oliva1-prog/portfolio/main/Обложка_AI.png", label: "AI креативы" },
    spreads: [
      { type:"normal", video:"https://raw.githubusercontent.com/oliva1-prog/portfolio/main/AI_ролик", videoCaption:"calligraphy studies — brush on paper", heading:"Typography", text:"A letter is a form. Not just a carrier of meaning, but an object with proportions, weight, character.\n\nI began studying calligraphy not for handwriting, but to understand how a sign is born." },
      { type:"normal", photo:"images/j2/s2.jpg", photoCaption:"grid layout — editorial project 2023", heading:"Grid and Rhythm", text:"Good grid is invisible. A reader does not notice it, just feels everything is in place.\n\nBad grid screams about itself in every line, every indent." },
      { type:"fullbleed", photo:"images/j2/full.jpg", caption:"Poster series, 2023 – font as image" },
      { type:"normal", photo:"images/j2/s4.jpg", photoCaption:"linocut print — black series", heading:"Black on White", text:"Constraints free. Remove color and only essentials remain: form, mass, movement.\n\nBlack and white is honesty. Nothing to hide behind." },
      { type:"normal", photo:"images/j2/s5.jpg", photoCaption:"wayfinding sign — city district, 2023", heading:"Letter in Space", text:"Font went outside. Signs, markers, graffiti – typography of place is different.\n\nIt exists in motion, under changing light, any weather. Different rules." }
    ]
  },
  {
    title: "Journal III",
    cover: { img: "images/covers/cover3.jpg", label: "Коммуникационный дизайн" },
    spreads: [
      { type:"normal", photo:"images/j3/s1.jpg", photoCaption:"Perm city centre — industrial district", heading:"Place", text:"I live in Perm. This matters. A city shapes vision – industrial history, river, eras mixed in buildings.\n\nI did not leave for Moscow. That was conscious choice – work from here." },
      { type:"normal", photo:"images/j3/s2.jpg", photoCaption:"public square redesign proposal, 2023", heading:"Local Context", text:"A cultural project changed the city. Not all were glad. But it asked questions that had to be asked.\n\nWhat is public space? Who owns the city?" },
      { type:"fullbleed", photo:"images/j3/full.jpg", caption:"Kama embankment – urban space as material" },
      { type:"normal", photo:"images/j3/s4.jpg", photoCaption:"pedestrian navigation system — installed signs", heading:"Project for City", text:"Navigation system for a walking route. Twelve points, three months, endless approvals.\n\nMade it. Still stands. Watched tourists use it – best feedback." },
      { type:"normal", photo:"images/j3/s5.jpg", photoCaption:"riverbank view — layered time", heading:"Location", text:"Location is not just coordinates. It is accumulated time, layers of meaning, others' and own memories.\n\nTo work with place means listening to it, not speaking over it." }
    ]
  },
  {
    title: "Journal IV",
    cover: { img: "https://raw.githubusercontent.com/oliva1-prog/portfolio/main/Обложка_крейзи.png", label: "Свободные работы" },
    spreads: [
      { type:"normal", photo:"images/j4/s1.jpg", photoCaption:"working drafts — sketchbook 2024", heading:"Process", text:"Process matters to me, not just result. Drafts, sketches, rejected versions – all are part of work.\n\nI keep sketches. Sometimes return to them a year later and see what I missed." },
      { type:"normal", photo:"images/j4/s2.jpg", photoCaption:"book layout — spread for small publisher", heading:"Book as Object", text:"A book is not just text. It is weight, smell, feel. Spreads as space.\n\nI made layouts for small publishers. Each time – separate universe." },
      { type:"fullbleed", photo:"images/j4/full.jpg", caption:"Work desk – November 2024" },
      { type:"normal", photo:"images/j4/s4.jpg", photoCaption:"handwritten type specimen — ink on paper", heading:"Handwritten", text:"I keep handwriting where it fits. Not as pastiche of 'handmade', but as real trace of hand.\n\nIn age of perfect render, imperfection becomes value." },
      { type:"normal", photo:"images/j4/s5.jpg", photoCaption:"studio corner — where it all happens", heading:"Contact", text:"If you read until here – something resonated. I am glad.\n\nWrite: olgaivashchenko.design@gmail.com\n\nLet us talk." }
    ]
  }
];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateLayout() {
  const W = window.innerWidth, H = window.innerHeight;
  const jW = Math.min(Math.floor(W * 0.23 + Math.random() * W * 0.05), 340);
  const jH = Math.floor(jW * (4 / 3));
  const margin = 28;
  const cols = 2, rows = 2;
  const cellW = (W - margin * 2) / cols;
  const cellH = (H - margin * 2) / rows;
  const cellOrder = shuffle([0, 1, 2, 3]);
  return cellOrder.map((cellIdx, i) => {
    const col = cellIdx % cols, row = Math.floor(cellIdx / cols);
    const cx = margin + col * cellW + cellW / 2;
    const cy = margin + row * cellH + cellH / 2;
    const mxJ = Math.min(cellW * 0.28, (W - margin - jW) / 2 - 10);
    const myJ = Math.min(cellH * 0.28, (H - margin - jH) / 2 - 10);
    let left = cx + (Math.random() * 2 - 1) * mxJ - jW / 2;
    let top = cy + (Math.random() * 2 - 1) * myJ - jH / 2;
    left = Math.max(margin, Math.min(W - margin - jW, left));
    top = Math.max(margin, Math.min(H - margin - jH, top));
    const rot = parseFloat((Math.random() * 24 - 12).toFixed(2));
    return { left, top, width: jW, rot, zIndex: 10 + i };
  });
}

const stage = document.getElementById('stage');
const titleEl = document.getElementById('title');
const hintEl = document.getElementById('hint');
const overlay = document.getElementById('overlay');
const spreadCont = document.getElementById('spread-container');
const spreadEl = document.getElementById('spread');
const pagination = document.getElementById('pagination');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');

let activeJournal = null;
let currentSpread = 0;
let topZ = 50;

const layout = generateLayout();
const wraps = [];

JOURNALS.forEach((j, i) => {
  const wrap = document.createElement('div');
  wrap.className = 'journal-wrap';
  wrap.setAttribute('tabindex', '0');
  wrap.setAttribute('role', 'button');
  wrap.setAttribute('aria-label', 'Open ' + j.title);

  const { left, top, width, rot, zIndex } = layout[i];
  wrap.style.left = left + 'px';
  wrap.style.top = top + 'px';
  wrap.style.width = width + 'px';
  wrap.style.zIndex = zIndex;
  wrap.style.setProperty('--rot', rot + 'deg');
  wrap.data_x = left;
  wrap.data_y = top;
  wrap.data_rot = rot;

  wrap.innerHTML = `
    <div class="journal-cover">
      <img src="${j.cover.img}" alt="${j.title} cover" loading="lazy" onerror="this.style.display='none'">
      <div class="cover-label">${j.cover.label}</div>
    </div>
    <div class="journal-num">0${i + 1}</div>
  `;

  attachDrag(wrap, i);
  wrap.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openJournal(i); }
  });

  stage.appendChild(wrap);
  wraps.push(wrap);
});

function attachDrag(wrap, idx) {
  let startX, startY, startLeft, startTop, wasDragged;

  function onDown(e) {
    if (activeJournal !== null) return;
    e.preventDefault();
    topZ++;
    wrap.style.zIndex = topZ;
    wasDragged = false;
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX;
    startY = pt.clientY;
    startLeft = wrap.data_x;
    startTop = wrap.data_y;
    wrap.classList.add('dragging');
    wrap.style.transform = 'rotate(' + wrap.data_rot + 'deg)';
    wrap.style.transition = 'none';
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);
  }

  function onMove(e) {
    e.preventDefault();
    const pt = e.touches ? e.touches[0] : e;
    const dx = pt.clientX - startX;
    const dy = pt.clientY - startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) wasDragged = true;
    wrap.data_x = startLeft + dx;
    wrap.data_y = startTop + dy;
    wrap.style.left = wrap.data_x + 'px';
    wrap.style.top = wrap.data_y + 'px';
  }

  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
    wrap.classList.remove('dragging');
    wrap.style.transition = '';
    if (!wasDragged) openJournal(idx);
  }

  wrap.addEventListener('mousedown', onDown);
  wrap.addEventListener('touchstart', onDown, { passive: false });
}

window.addEventListener('load', () => {
  const order = shuffle([...Array(wraps.length).keys()]);
  order.forEach((idx, seq) => {
    const w = wraps[idx];
    setTimeout(() => {
      w.classList.add('fly', 'animating');
      w.addEventListener('animationend', () => {
        w.classList.remove('animating', 'fly');
        w.classList.add('landed');
        w.style.transform = 'rotate(' + w.data_rot + 'deg)';
      }, { once: true });
    }, seq * 280 + 200);
  });

  const lastDelay = (wraps.length - 1) * 280 + 200 + 1050 + 400;
  setTimeout(() => titleEl.classList.add('show'), lastDelay);
  setTimeout(() => hintEl.classList.add('show'), lastDelay + 1400);

  // Инициализация мобильной версии (если мобильный экран)
  mobileOrDesktopInit();
  window.addEventListener('resize', mobileOrDesktopInit);
});

function openJournal(idx) {
  activeJournal = idx;
  currentSpread = 0;
  hintEl.classList.remove('show');
  renderSpread();
  buildPagination();
  overlay.classList.add('show');
  spreadCont.classList.add('show');
  requestAnimationFrame(() => requestAnimationFrame(() => spreadEl.classList.add('open')));
  spreadEl.focus();
}

function closeJournal() {
  spreadEl.classList.remove('open');
  setTimeout(() => {
    overlay.classList.remove('show');
    spreadCont.classList.remove('show');
    activeJournal = null;
  }, 380);
  hintEl.classList.add('show');
}

overlay.addEventListener('click', closeJournal);
overlay.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') closeJournal();
});

document.addEventListener('keydown', e => {
  if (activeJournal === null) return;
  if (e.key === 'Escape') closeJournal();
  if (e.key === 'ArrowLeft') prevSpread();
  if (e.key === 'ArrowRight') nextSpread();
});

function renderSpread() {
  const j = JOURNALS[activeJournal];
  const s = j.spreads[currentSpread];
  spreadEl.innerHTML = '';

  if (s.type === 'fullbleed') {
    const fb = document.createElement('div');
    fb.className = 'spread-fullbleed';
    fb.innerHTML = '<img src="' + s.photo + '" alt="Spread ' + (currentSpread + 1) + '" onerror="this.style.background=\'oklch(25% 0.01 260)\'">' +
      '<div class="caption">' + (s.caption || '') + '</div>';
    spreadEl.appendChild(fb);
  } else {
    const left = document.createElement('div');
    left.className = 'page page-photo';
    left.innerHTML = '<img src="' + s.photo + '" alt="Photo spread ' + (currentSpread + 1) + '" onerror="this.style.background=\'oklch(22% 0.01 260)\'">' +
      (s.photoCaption ? '<div class="photo-caption">' + s.photoCaption + '</div>' : '');
    
    const right = document.createElement('div');
    right.className = 'page page-text';
    const paras = s.text.split('\n\n').map(t => '<p>' + t.replace(/\n/g, '<br>') + '</p>').join('');
    right.innerHTML = '<div class="spread-label">' + j.title + ' &nbsp;/&nbsp; ' + (currentSpread + 1) + ' of ' + j.spreads.length + '</div>' +
      '<h2>' + s.heading + '</h2>' + paras;
    
    spreadEl.appendChild(left);
    spreadEl.appendChild(right);
  }
  updateNav();
}

function buildPagination() {
  pagination.innerHTML = '';
  JOURNALS[activeJournal].spreads.forEach((_, i) => {
    const dot = document.createElement('button');
    dot.className = 'page-dot' + (i === currentSpread ? ' active' : '');
    dot.textContent = i + 1;
    dot.setAttribute('aria-label', 'Spread ' + (i + 1));
    dot.addEventListener('click', e => { e.stopPropagation(); goToSpread(i); });
    pagination.appendChild(dot);
  });
}

function updatePagination() {
  pagination.querySelectorAll('.page-dot').forEach((d, i) =>
    d.classList.toggle('active', i === currentSpread));
}

function updateNav() {
  const total = JOURNALS[activeJournal].spreads.length;
  btnPrev.disabled = currentSpread === 0;
  btnNext.disabled = currentSpread === total - 1;
  btnPrev.style.opacity = btnPrev.disabled ? '0.28' : '1';
  btnNext.style.opacity = btnNext.disabled ? '0.28' : '1';
  updatePagination();
}

function goToSpread(i) { currentSpread = i; renderSpread(); }
function prevSpread() { if (currentSpread > 0) goToSpread(currentSpread - 1); }
function nextSpread() {
  if (activeJournal !== null && currentSpread < JOURNALS[activeJournal].spreads.length - 1)
    goToSpread(currentSpread + 1);
}

document.getElementById('tap-left').addEventListener('click', e => { e.stopPropagation(); prevSpread(); });
document.getElementById('tap-right').addEventListener('click', e => { e.stopPropagation(); nextSpread(); });

let tsX = 0;
spreadEl.addEventListener('touchstart', e => { tsX = e.touches[0].clientX; }, { passive: true });
spreadEl.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tsX;
  if (Math.abs(dx) > 44) dx < 0 ? nextSpread() : prevSpread();
});

/* Мобильная версия: генерация карусели журналов */
function isMobileView() {
  return window.matchMedia('(max-width: 768px)').matches;
}

function buildMobileStrip() {
  const strip = document.getElementById('mobile-strip');
  if (!strip) return;
  strip.innerHTML = '';

  JOURNALS.forEach((j, i) => {
    const card = document.createElement('div');
    card.className = 'mobile-card';
    card.setAttribute('tabindex', '0');
    card.innerHTML = `
      <img src="${j.cover.img}" alt="${j.title} cover" loading="lazy" onerror="this.style.display='none'">
      <div class="mobile-caption">${j.title} • ${j.cover.label}</div>
    `;

    // Правый кликабельный участок — пролистывание к следующему журналу
    const right = document.createElement('div');
    right.className = 'mobile-right';
    right.addEventListener('click', (e) => {
      e.stopPropagation();
      const nextIdx = i + 1;
      if (nextIdx < JOURNALS.length) {
        const nextCard = strip.querySelectorAll('.mobile-card')[nextIdx];
        if (nextCard) nextCard.scrollIntoView({ behavior: 'smooth', inline: 'start' });
      }
    });
    card.appendChild(right);

    // Открыть журнал по клику на карточку
    card.addEventListener('click', () => openJournal(i));

    strip.appendChild(card);
  });
}

function mobileOrDesktopInit() {
  if (isMobileView()) {
    // Мобайл: показать мобильную ленту и скрыть основной стажер
    const stageExists = !!document.getElementById('stage');
    if (stageExists) document.getElementById('stage').style.display = 'none';
    const strip = document.getElementById('mobile-strip');
    if (strip) {
      strip.style.display = 'flex';
      buildMobileStrip();
    }
  } else {
    // Десктоп: вернуть обычный режим
    const strip = document.getElementById('mobile-strip');
    if (strip) strip.style.display = 'none';
    const stageExists = !!document.getElementById('stage');
    if (stageExists) document.getElementById('stage').style.display = '';
  }
}

/* Инициализация и обработчики изменений размера экрана */
window.addEventListener('resize', () => {
  mobileOrDesktopInit();
});

</script>
