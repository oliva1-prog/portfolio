<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ольга Иващенко (Иволга) — Портфолио</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         oklch(16% 0.008 260);
      --surface:    oklch(21% 0.010 260);
      --border:     oklch(28% 0.012 260);
      --text-muted: oklch(52% 0.012 260);
      --text:       oklch(88% 0.006 260);
      /* ultramarine blue accent */
      --accent:     oklch(58% 0.20 264);
      --accent-hi:  oklch(68% 0.18 264);
      --accent-dim: oklch(42% 0.14 264);
      --r-sm: 3px;
      --r-md: 8px;
      --r-lg: 12px;
      --font: 'Source Code Pro', 'Courier New', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font);
      color: var(--text);
      user-select: none;
    }

    #stage {
      position: relative;
      width: 100%; height: 100%;
    }

    /* ── TITLE ── */
    #title {
      position: fixed;
      top: clamp(18px, 4vh, 40px);
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      z-index: 90;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #title.show { animation: titleFade 2.4s ease forwards; }
    #title h1 {
      font-family: var(--font);
      font-size: clamp(0.85rem, 1.6vw, 1.15rem);
      font-weight: 400;
      letter-spacing: 0.18em;
      color: var(--text);
      text-transform: uppercase;
    }
    #title p {
      font-family: var(--font);
      font-size: clamp(0.65rem, 1vw, 0.78rem);
      color: var(--text-muted);
      letter-spacing: 0.22em;
      font-style: italic;
    }
    @keyframes titleFade {
      from { opacity: 0; transform: translateX(-50%) translateY(8px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ── INVITE BUTTON — lives inside #title, below the subtitle ── */
    #invite-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      padding: 6px 14px 6px 10px;
      border-radius: 20px;
      text-decoration: none;
      font-family: var(--font);
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      /* colourful: blue background */
      background: var(--accent);
      color: oklch(97% 0.006 264);
      border: 1px solid var(--accent-hi);
      box-shadow: 0 2px 12px oklch(58% 0.20 264 / 0.35);
      transition: background 0.18s, box-shadow 0.18s, transform 0.18s;
      pointer-events: none; /* enabled when .show added */
      opacity: 0;
    }
    #title.show #invite-btn {
      opacity: 1;
      pointer-events: all;
      /* inherit fade from parent */
    }
    #invite-btn:hover {
      background: var(--accent-hi);
      box-shadow: 0 4px 20px oklch(68% 0.18 264 / 0.45);
      transform: translateY(-1px);
    }
    #invite-btn:active { transform: translateY(0); }
    #invite-btn svg { flex-shrink: 0; }

    /* ── HINT ── */
    #hint {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font);
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity 0.8s;
      pointer-events: none;
      z-index: 90;
    }
    #hint.show { opacity: 1; }

    /* ── JOURNAL WRAP ── */
    .journal-wrap {
      position: absolute;
      opacity: 0;
      cursor: grab;
      touch-action: none;
    }
    .journal-wrap:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: var(--r-md);
    }
    .journal-wrap.dragging {
      cursor: grabbing;
      transition: none !important;
    }

    .journal-cover {
      width: 100%;
      aspect-ratio: 3/4;
      border-radius: var(--r-md);
      overflow: hidden;
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow:
        0 12px 40px oklch(5% 0.01 260 / 0.65),
        0 3px  8px  oklch(5% 0.01 260 / 0.35);
      transition: box-shadow 0.2s ease, transform 0.15s ease;
      pointer-events: none;
    }
    .journal-wrap:not(.dragging):not(.fly):hover .journal-cover {
      box-shadow:
        0 20px 60px oklch(5% 0.01 260 / 0.75),
        0 6px  16px oklch(5% 0.01 260 / 0.45);
      transform: scale(1.025);
    }
    .journal-cover img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .cover-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 10px 12px 14px;
      background: linear-gradient(transparent, oklch(8% 0.01 260 / 0.88));
      font-family: var(--font);
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: oklch(80% 0.008 260);
      line-height: 1.4;
    }
    .journal-num {
      position: absolute;
      top: 8px; left: 10px;
      font-family: var(--font);
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      color: var(--accent-hi);
      font-weight: 500;
    }

    @keyframes flyUp {
      0%   { transform: translateY(110vh) rotate(0deg);            opacity: 0; }
      55%  { opacity: 1; }
      72%  { transform: translateY(-18px) rotate(calc(var(--rot)*0.6)); }
      84%  { transform: translateY(8px)   rotate(calc(var(--rot)*1.15)); }
      93%  { transform: translateY(-4px)  rotate(calc(var(--rot)*0.92)); }
      100% { transform: translateY(0)     rotate(var(--rot));       opacity: 1; }
    }
    .journal-wrap.fly {
      animation: flyUp 1.05s cubic-bezier(0.18, 0.58, 0.36, 1) forwards;
    }
    .journal-wrap.landed {
      opacity: 1;
      transform: rotate(var(--rot));
    }

    /* ── OVERLAY ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: oklch(6% 0.01 260 / 0.78);
      backdrop-filter: blur(4px);
      z-index: 100;
      cursor: pointer;
    }
    #overlay.show { display: block; }

    /* ── SPREAD CONTAINER ── */
    #spread-container {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      pointer-events: none;
      align-items: center;
      justify-content: center;
    }
    #spread-container.show { display: flex; }

    #spread {
      pointer-events: all;
      position: relative;
      width: min(94vw, 980px);
      height: min(82vh, 660px);
      display: flex;
      background: oklch(97% 0.004 264);
      border-radius: var(--r-lg);
      overflow: hidden;
      box-shadow: 0 28px 90px oklch(4% 0.02 260 / 0.85);
      transform: scale(0.86) translateY(16px);
      opacity: 0;
      transition:
        transform 0.4s cubic-bezier(0.34, 1.24, 0.64, 1),
        opacity   0.3s ease;
    }
    #spread.open {
      transform: scale(1) translateY(0);
      opacity: 1;
    }
    #spread::after {
      content: '';
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(to right,
        oklch(55% 0.04 264 / 0.22),
        oklch(75% 0.02 264 / 0.06),
        oklch(55% 0.04 264 / 0.22));
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 3;
    }

    .page { width: 50%; height: 100%; overflow: hidden; position: relative; }
    .page-photo { background: oklch(20% 0.01 260); }
    .page-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .page-text {
      background: oklch(97.5% 0.003 264);
      padding: clamp(28px,5%,52px) clamp(24px,5%,48px) 60px;
      display: flex; flex-direction: column;
      justify-content: flex-start;
      overflow-y: auto;
      color: oklch(20% 0.01 264);
    }
    .page-text::-webkit-scrollbar { width: 3px; }
    .page-text::-webkit-scrollbar-thumb {
      background: oklch(78% 0.04 264);
      border-radius: 2px;
    }
    .spread-label {
      font-family: var(--font); font-size: 0.58rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--accent-dim); margin-bottom: 20px;
    }
    .page-text h2 {
      font-family: var(--font);
      font-size: clamp(0.82rem, 1.4vw, 1.05rem);
      font-weight: 500; letter-spacing: 0.08em;
      line-height: 1.3; margin-bottom: 18px;
      color: oklch(22% 0.015 264); text-transform: uppercase;
    }
    .page-text p {
      font-family: var(--font);
      font-size: clamp(0.7rem, 1.05vw, 0.82rem);
      line-height: 1.85; color: oklch(30% 0.009 264);
      text-align: left; margin-bottom: 14px;
    }
    .page-text p:last-child { margin-bottom: 0; }

    .spread-fullbleed { width: 100%; height: 100%; position: relative; }
    .spread-fullbleed img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .spread-fullbleed .caption {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 14px 28px 22px;
      background: linear-gradient(transparent, oklch(6% 0.01 264 / 0.72));
      color: oklch(93% 0.004 264);
      font-family: var(--font); font-size: clamp(0.62rem,1vw,0.76rem);
      font-style: italic; letter-spacing: 0.1em;
    }

    /* ── PAGINATION ── */
    #pagination {
      position: absolute; bottom: 16px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 5; pointer-events: all;
    }
    .page-dot {
      width: 24px; height: 24px; border-radius: 50%;
      border: 1px solid oklch(55% 0.08 264);
      background: transparent; cursor: pointer;
      transition: background 0.16s, border-color 0.16s;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font); font-size: 0.58rem;
      color: oklch(55% 0.08 264);
    }
    .page-dot:hover, .page-dot.active {
      background: var(--accent);
      border-color: var(--accent);
      color: oklch(97% 0.005 264);
    }
    .page-dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── ARROWS ── */
    .arrow-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: oklch(97% 0.004 264 / 0.55);
      border: 1px solid oklch(82% 0.015 264);
      border-radius: 50%; width: 34px; height: 34px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      z-index: 5; transition: background 0.14s; pointer-events: all;
      color: oklch(28% 0.01 264);
    }
    .arrow-btn:hover { background: oklch(100% 0 0 / 0.9); }
    .arrow-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #btn-prev { left: -46px; }
    #btn-next { right: -46px; }
    @media (max-width: 680px) {
      #btn-prev { left: 4px; }
      #btn-next { right: 4px; }
    }
  </style>
</head>

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateLayout() {
  const W = window.innerWidth, H = window.innerHeight;
  const jW = Math.min(Math.floor(W * 0.23 + Math.random() * W * 0.05), 340);
  const jH = Math.floor(jW * (4 / 3));
  const margin = 28;
  const cols = 2, rows = 2;
  const cellW = (W - margin * 2) / cols;
  const cellH = (H - margin * 2) / rows;
  const cellOrder = shuffle([0, 1, 2, 3]);
  return cellOrder.map((cellIdx, i) => {
    const col = cellIdx % cols, row = Math.floor(cellIdx / cols);
    const cx = margin + col * cellW + cellW / 2;
    const cy = margin + row * cellH + cellH / 2;
    const mxJ = Math.min(cellW * 0.28, (W - margin - jW) / 2 - 10);
    const myJ = Math.min(cellH * 0.28, (H - margin - jH) / 2 - 10);
    let left = cx + (Math.random() * 2 - 1) * mxJ - jW / 2;
    let top  = cy + (Math.random() * 2 - 1) * myJ - jH / 2;
    left = Math.max(margin, Math.min(W - margin - jW, left));
    top  = Math.max(margin, Math.min(H - margin - jH, top));
    const rot = parseFloat((Math.random() * 24 - 12).toFixed(2));
    return { left, top, width: jW, rot, zIndex: 10 + i };
  });
}

const stage      = document.getElementById('stage');
const titleEl    = document.getElementById('title');
const hintEl     = document.getElementById('hint');
const overlay    = document.getElementById('overlay');
const spreadCont = document.getElementById('spread-container');
const spreadEl   = document.getElementById('spread');
const pagination = document.getElementById('pagination');
const btnPrev    = document.getElementById('btn-prev');
const btnNext    = document.getElementById('btn-next');

let activeJournal = null;
let currentSpread = 0;
let topZ = 50;

const layout = generateLayout();
const wraps  = [];

JOURNALS.forEach((j, i) => {
  const wrap = document.createElement('div');
  wrap.className = 'journal-wrap';
  wrap.setAttribute('tabindex', '0');
  wrap.setAttribute('role', 'button');
  wrap.setAttribute('aria-label', `Открыть ${j.title}`);

  const { left, top, width, rot, zIndex } = layout[i];
  wrap.style.left   = left + 'px';
  wrap.style.top    = top  + 'px';
  wrap.style.width  = width + 'px';
  wrap.style.zIndex = zIndex;
  wrap.style.setProperty('--rot', rot + 'deg');
  wrap._x   = left;
  wrap._y   = top;
  wrap._rot = rot;

  wrap.innerHTML = `
    <div class="journal-cover">
      <img src="${j.cover.img}" alt="${j.title} обложка" loading="lazy"
           onerror="this.style.display='none'">
      <div class="cover-label">${j.cover.label}</div>
    </div>
    <div class="journal-num">0${i + 1}</div>
  `;

  attachDrag(wrap, i);
  wrap.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openJournal(i); }
  });

  stage.appendChild(wrap);
  wraps.push(wrap);
});

function attachDrag(wrap, idx) {
  let startX, startY, startLeft, startTop, wasDragged;

  function onDown(e) {
    if (activeJournal !== null) return;
    e.preventDefault();
    topZ++;
    wrap.style.zIndex = topZ;
    wasDragged = false;
    const pt = e.touches ? e.touches[0] : e;
    startX    = pt.clientX;
    startY    = pt.clientY;
    startLeft = wrap._x;
    startTop  = wrap._y;
    wrap.classList.add('dragging');
    wrap.style.transform = `rotate(${wrap._rot}deg)`;
    wrap.style.transition = 'none';
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup',   onUp);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend',  onUp);
  }

  function onMove(e) {
    e.preventDefault();
    const pt = e.touches ? e.touches[0] : e;
    const dx = pt.clientX - startX;
    const dy = pt.clientY - startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) wasDragged = true;
    wrap._x = startLeft + dx;
    wrap._y = startTop  + dy;
    wrap.style.left = wrap._x + 'px';
    wrap.style.top  = wrap._y + 'px';
  }

  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup',   onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend',  onUp);
    wrap.classList.remove('dragging');
    wrap.style.transition = '';
    if (!wasDragged) openJournal(idx);
  }

  wrap.addEventListener('mousedown',  onDown);
  wrap.addEventListener('touchstart', onDown, { passive: false });
}

window.addEventListener('load', () => {
  const order = shuffle([...Array(wraps.length).keys()]);
  order.forEach((idx, seq) => {
    const w = wraps[idx];
    setTimeout(() => {
      w.classList.add('fly', 'animating');
      w.addEventListener('animationend', () => {
        w.classList.remove('animating', 'fly');
        w.classList.add('landed');
        w.style.transform = `rotate(${w._rot}deg)`;
      }, { once: true });
    }, seq * 280 + 200);
  });

  const lastDelay = (wraps.length - 1) * 280 + 200 + 1050 + 400;
  setTimeout(() => titleEl.classList.add('show'), lastDelay);
  setTimeout(() => hintEl.classList.add('show'),  lastDelay + 1400);
});

function openJournal(idx) {
  activeJournal = idx;
  currentSpread = 0;
  hintEl.classList.remove('show');
  renderSpread();
  buildPagination();
  overlay.classList.add('show');
  spreadCont.classList.add('show');
  requestAnimationFrame(() => requestAnimationFrame(() => spreadEl.classList.add('open')));
  spreadEl.focus();
}

function closeJournal() {
  spreadEl.classList.remove('open');
  setTimeout(() => {
    overlay.classList.remove('show');
    spreadCont.classList.remove('show');
    activeJournal = null;
  }, 380);
  hintEl.classList.add('show');
}

overlay.addEventListener('click', closeJournal);
overlay.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') closeJournal();
});
document.addEventListener('keydown', e => {
  if (activeJournal === null) return;
  if (e.key === 'Escape')     closeJournal();
  if (e.key === 'ArrowLeft')  prevSpread();
  if (e.key === 'ArrowRight') nextSpread();
});

function renderSpread() {
  const j = JOURNALS[activeJournal];
  const s = j.spreads[currentSpread];
  spreadEl.innerHTML = '';

  if (s.type === 'fullbleed') {
    const fb = document.createElement('div');
    fb.className = 'spread-fullbleed';
    fb.innerHTML = `
      <img src="${s.photo}" alt="Разворот ${currentSpread + 1}"
           onerror="this.style.background='oklch(25% 0.01 260)'">
      <div class="caption">${s.caption || ''}</div>
    `;
    spreadEl.appendChild(fb);
  } else {
    const left = document.createElement('div');
    left.className = 'page page-photo';
    left.innerHTML = `<img src="${s.photo}" alt="Фото разворота ${currentSpread + 1}"
                          onerror="this.style.background='oklch(22% 0.01 260)'">`;
    const right = document.createElement('div');
    right.className = 'page page-text';
    const paras = s.text.split('\n\n').map(t =>
      `<p>${t.replace(/\n/g, '<br>')}</p>`).join('');
    right.innerHTML = `
      <div class="spread-label">${j.title} &nbsp;/&nbsp; ${currentSpread + 1} из ${j.spreads.length}</div>
      <h2>${s.heading}</h2>
      ${paras}
    `;
    spreadEl.appendChild(left);
    spreadEl.appendChild(right);
  }
  updateNav();
}

function buildPagination() {
  pagination.innerHTML = '';
  JOURNALS[activeJournal].spreads.forEach((_, i) => {
    const dot = document.createElement('button');
    dot.className = 'page-dot' + (i === currentSpread ? ' active' : '');
    dot.textContent = i + 1;
    dot.setAttribute('aria-label', `Разворот ${i + 1}`);
    dot.addEventListener('click', e => { e.stopPropagation(); goToSpread(i); });
    pagination.appendChild(dot);
  });
}

function updatePagination() {
  pagination.querySelectorAll('.page-dot').forEach((d, i) =>
    d.classList.toggle('active', i === currentSpread));
}

function updateNav() {
  const total = JOURNALS[activeJournal].spreads.length;
  btnPrev.disabled = currentSpread === 0;
  btnNext.disabled = currentSpread === total - 1;
  btnPrev.style.opacity = btnPrev.disabled ? '0.28' : '1';
  btnNext.style.opacity = btnNext.disabled ? '0.28' : '1';
  updatePagination();
}

function goToSpread(i) { currentSpread = i; renderSpread(); }
function prevSpread()  { if (currentSpread > 0) goToSpread(currentSpread - 1); }
function nextSpread()  {
  if (activeJournal !== null && currentSpread < JOURNALS[activeJournal].spreads.length - 1)
    goToSpread(currentSpread + 1);
}

btnPrev.addEventListener('click', e => { e.stopPropagation(); prevSpread(); });
btnNext.addEventListener('click', e => { e.stopPropagation(); nextSpread(); });

let tsX = 0;
spreadEl.addEventListener('touchstart', e => { tsX = e.touches[0].clientX; }, { passive: true });
spreadEl.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - tsX;
  if (Math.abs(dx) > 44) dx < 0 ? nextSpread() : prevSpread();
});
</script>
</body>
</html>
